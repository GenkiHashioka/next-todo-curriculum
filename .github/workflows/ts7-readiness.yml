name: TypeScript 7 readiness check

# TypeScript 7（ネイティブコンパイラ）は現在 Next.js 16 の型チェックと
# typescript-eslint が未対応のため .github/dependabot.yml で除外している。
# エコシステムが追随したことに気づけるよう、月 1 回だけ「TS 7 を入れたら通るか」を
# 実際に試し、通るようになったら Issue で知らせる。
on:
  schedule:
    - cron: "0 0 1 * *" # 毎月 1 日 09:00 JST（UTC 00:00）
  workflow_dispatch: # 手動でも実行できる

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: TS 7 で build が通るか試す
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-dummy-secret-for-build-only
      DB_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TS 7 を入れて build（型チェック含む）が通るか試す。
      #
      # 注意: continue-on-error は失敗を握りつぶして outcome/conclusion まで success に
      # 変えてしまい、後段の判定に使えない。そのため終了コードを自分で受け取り、
      # 結果を明示的に output へ書き出す。
      - name: Try TypeScript 7 and build
        id: check
        run: |
          set +e
          npm install -D typescript@7 --force
          install_code=$?
          if [ "$install_code" -ne 0 ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "reason=TypeScript 7 のインストールに失敗しました（peer 依存の不一致など）" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm run build
          build_code=$?
          if [ "$build_code" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "reason=build に成功しました" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "reason=build が失敗しました（終了コード ${build_code}）" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # 通った場合だけ Issue を作成して知らせる（普段は何も起きない）
      - name: Open issue when TS 7 becomes usable
        if: steps.check.outputs.usable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 既に同じ Issue が開いていれば重複して立てない
          existing=$(gh issue list --state open --search "TypeScript 7 in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "TypeScript 7 が使えるようになった可能性があります" \
              --body "月次チェックで **TypeScript 7 を入れた状態の \`npm run build\`（型チェック含む）が成功** しました。

            エコシステムが追随した可能性があります。次の対応を検討してください。

            1. \`.github/dependabot.yml\` の \`ignore\`（typescript \`>=7\`）を外す
            2. TS 7 へメジャー更新する PR を確認してマージする
            3. \`npm run lint\`（typescript-eslint）も問題ないか確認する

            > このチェックは \`.github/workflows/ts7-readiness.yml\` が自動実行しています。
            > まだ早いと判断した場合は、この Issue を閉じれば翌月また通知されます。" \
              --label dependencies
          fi

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.usable }}" = "true" ]; then
            echo "✅ TS 7 が使えるようになりました（Issue を作成しました）" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏳ TS 7 はまだ使えません（想定内・翌月また確認します）" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "判定理由: ${{ steps.check.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
