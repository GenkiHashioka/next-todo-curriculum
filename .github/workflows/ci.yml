name: CI

# このブランチ（参考実装）への push と、すべての PR で実行する。
#
# 参考実装は Vercel にデプロイされ、受講者が完成イメージを掴むために触るもの。
# 壊れたまま公開されないよう、push のたびにビルドとテストを確認する。
# （push イベントのワークフローは push 先ブランチの定義が使われるため、
#   このファイルはこのブランチにも必要）
#
# 以前はドキュメントだけの変更を paths-ignore で除外していた。
# Actions の無料枠を節約するためだったが、次の 2 点から除外をやめた。
#
# 1. public リポジトリの標準ランナーは Actions が無料。節約する理由がなくなった。
# 2. ブランチ保護で `build & test` を必須チェックにすると、
#    除外が有効だと「CI がスキップ ＝ チェックが報告されない」状態になり、
#    ドキュメントだけの PR が永久にマージできなくなる。
#
# （教材と実装の食い違いは .claude/skills/check-curriculum-sync で別途検査する）
on:
  push:
    branches: [reference/v3-complete]
  pull_request:

# 同じブランチで新しい push があったら、古い実行はキャンセルして無駄な時間を使わない
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest

    # ビルド時に参照される環境変数。CI ではダミー値で十分
    #（テストは DB をモックしているので、実際の DB 接続は不要）
    env:
      NODE_ENV: test
      JWT_SECRET: ci-dummy-secret-for-build-only
      DB_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Jest は Node で動くため、bun と両方を用意する。
      # （テストを bun test へ移行しない理由は
      #   .docs/curriculum/INSTRUCTOR_GUIDE.md の「テストについて」を参照）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check (Biome)
        run: bunx biome ci src/
        continue-on-error: true # 既存の指摘があるため、当面は警告扱い

      - name: Test
        run: bun run test

      - name: Build (型チェックを含む)
        run: bun run build
