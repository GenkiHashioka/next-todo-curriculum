name: CI

# このブランチ（参考実装）への push と、すべての PR で実行する。
#
# 参考実装は Vercel にデプロイされ、受講者が完成イメージを掴むために触るもの。
# 壊れたまま公開されないよう、push のたびにビルドとテストを確認する。
# （push イベントのワークフローは push 先ブランチの定義が使われるため、
#   このファイルはこのブランチにも必要）
#
# ドキュメントだけの変更では実行しない。
# 教材のコード例は実行されないため、ビルドやテストの結果は変わらないため。
# （教材と実装の食い違いは .claude/skills/check-curriculum-sync で別途検査する）
#
# 除外が効くのは「変更されたファイルがすべて除外対象のとき」だけ。
# コードが 1 ファイルでも含まれていれば実行される。
on:
  push:
    branches: [reference/v3-complete]
    paths-ignore:
      - '**.md'
      - '.docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.docs/**'
      - '.claude/**'

# 同じブランチで新しい push があったら、古い実行はキャンセルして無駄な時間を使わない
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest

    # ビルド時に参照される環境変数。CI ではダミー値で十分
    #（テストは DB をモックしているので、実際の DB 接続は不要）
    env:
      NODE_ENV: test
      JWT_SECRET: ci-dummy-secret-for-build-only
      DB_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npx biome ci src/
        continue-on-error: true # 既存の指摘があるため、当面は警告扱い

      - name: Test
        run: npm test

      - name: Build (型チェックを含む)
        run: npm run build
