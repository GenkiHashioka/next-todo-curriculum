name: CI

# main への push と、すべての PR で実行する。
# 依存更新 PR（Dependabot）が壊れていないかを、ここで自動判定する。
on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら、古い実行はキャンセルして無駄な時間を使わない
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest

    # ビルド時に参照される環境変数。CI ではダミー値で十分
    #（テストは DB をモックしているので、実際の DB 接続は不要）
    env:
      NODE_ENV: test
      JWT_SECRET: ci-dummy-secret-for-build-only
      DB_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npx biome ci src/
        continue-on-error: true # 既存の指摘があるため、当面は警告扱い

      - name: Test
        run: npm test

      - name: Build (型チェックを含む)
        run: npm run build
