version: 2

updates:
  # ── npm パッケージ ────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # PR が溢れないように上限を設ける
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

    ignore:
      # TypeScript 7 を除外している理由（2026-08-03 時点で実機検証済み）
      #
      # TS 7 はコンパイラが Go で書き直され、従来の JavaScript 版コンパイラ API を
      # 提供しなくなった。Next.js の内蔵型チェッカーはその API を使うため動かせない。
      # 実際に試すと次のエラーで build が止まる:
      #
      #   TypeScript 7.0.2 does not provide the compiler API required by Next.js.
      #   Enable experimental.useTypeScriptCli in your Next.js config to use the
      #   TypeScript CLI, or install TypeScript 6 instead.
      #
      # ■ 回避策はあるが、採用していない
      # メッセージにあるとおり next.config.ts に experimental.useTypeScriptCli: true を
      # 付ければ TS 7 でも型チェックは走る（検証済み）。採用しない理由は 2 つ:
      #   1. experimental 扱い（型定義上も ExperimentalConfig 配下）なので、
      #      Next.js のマイナー更新で予告なく変わり得る。ここは自動マージ対象であり、
      #      受講者が「昨日まで動いたビルドが壊れた」を自力で追うのは難しい
      #   2. 有効にすると型チェックの対象が広がり、テストファイルの型エラーが 9 件出る
      #      （Zod 4 の $ZodIssueTooSmall、crypto.randomUUID() の戻り値型）。
      #      これは TS 7 のせいではなく TS 6 でも同じく出る。つまり Next.js の
      #      内蔵チェッカーはテストファイルを見ていない。先に直す必要がある
      #
      # ■ typescript-eslint の peer は `<6.1.0` だが、これは npm が警告を出すだけで
      #   インストール自体は通る。止めているのは Next.js の方。
      #
      # ■ 解禁の判断
      # .github/workflows/ts7-readiness.yml が月 1 回「回避策なしで build が通るか」を
      # 実際に試し、通るようになったら Issue で通知する。通知が来たらこの ignore を外す。
      # （TS 6.x のパッチ / マイナー更新は通常どおり PR が作られる）
      - dependency-name: typescript
        versions:
          - ">=7"

    # 更新をまとめて PR 数を減らす。
    # patch / minor は「安全な更新」としてまとめ、CI が緑なら自動マージされる（auto-merge.yml）。
    # major は別 PR に分離し、必ず人間が確認する。
    groups:
      safe-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  # ── GitHub Actions 自体の更新 ──────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
